stages:
  - deploy

publish_to_ghost:
  stage: deploy
  image: python:3.9
  only:
    - main  # 假设 main 分支用于 Ghost 发布
  before_script:
    - pip install requests PyJWT PyYAML markdown-it-py
  script:
    - python3 ghost_sync.py shuangyueji/
    - python3 ghost_sync.py murenji/history.md
    - python3 ghost_sync.py murenji/geology.md
    - python3 ghost_sync.py murenji/technology.md
  environment:
    name: ghost-blog
    url: https://blog.seekkey.eu.org

sync_to_codeup:
  stage: deploy
  only:
    - wikijs-new
  script:
    - git remote remove aliyun || true
    - git remote add aliyun https://houzhongxu:pt-uYAvBi3ewsN0nSvOAzLYoiZP_0ffb501d-7652-4fb2-9394-53eb7e7b1a6e@codeup.aliyun.com/698053416ec1ba182dc6e452/seekkey/kunpengzhi.git
    - git push aliyun HEAD:refs/heads/wikijs-new
