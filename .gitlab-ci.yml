stages:
  - sync

sync_to_github:
  stage: sync
  tags:
    - group
  script:
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - git config --global credential.helper store
    - echo "https://${GITHUB_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials
    - git remote add github "https://github.com/Seek-Key-LTD/kunpengzhi.git" 2>/dev/null || git remote set-url github "https://github.com/Seek-Key-LTD/kunpengzhi.git"
    - git push -f github HEAD:hugo
  only:
    - hugo
