stages:
  - sync

sync_all:
  stage: sync
  tags:
    - group
  script:
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - |
      # 1. Sync to GitHub (Seek-Key-LTD)
      if [ -n "$GITHUB_TOKEN" ]; then
        echo "Syncing to GitHub...";
        git remote add gh "https://${GITHUB_TOKEN}@github.com/Seek-Key-LTD/kunpengzhi.git" 2>/dev/null || git remote set-url gh "https://${GITHUB_TOKEN}@github.com/Seek-Key-LTD/kunpengzhi.git";
        git push -f gh HEAD:$CI_COMMIT_REF_NAME;
      else
        echo "GITHUB_TOKEN not found, skipping GitHub sync.";
      fi
    - |
      # 2. Sync to Aliyun (Codeup)
      if [ -n "$YUNXIAO_ACCESS_TOKEN" ]; then
        echo "Syncing to Aliyun...";
        git remote add ali "https://houzhongxu:${YUNXIAO_ACCESS_TOKEN}@codeup.aliyun.com/698053416ec1ba182dc6e452/seekkey/kunpengzhi.git" 2>/dev/null || git remote set-url ali "https://houzhongxu:${YUNXIAO_ACCESS_TOKEN}@codeup.aliyun.com/698053416ec1ba182dc6e452/seekkey/kunpengzhi.git";
        git push -f ali HEAD:$CI_COMMIT_REF_NAME;
      else
        echo "YUNXIAO_ACCESS_TOKEN not found, skipping Aliyun sync.";
      fi
  only:
    - main
    - develop
    - hugo
    - ghost
    - i18n
    - wikijs
    - wikijs-new
