stages:
  - sync

sync_all:
  stage: sync
  tags:
    - group
  script:
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - |
      if [ -n "$GITHUB_TOKEN" ]; then
        echo "Syncing to GitHub...";
        git remote add gh "https://${GITHUB_TOKEN}@github.com/Seek-Key-LTD/kunpengzhi.git" 2>/dev/null || git remote set-url gh "https://${GITHUB_TOKEN}@github.com/Seek-Key-LTD/kunpengzhi.git";
        git push -f gh HEAD:$CI_COMMIT_REF_NAME;
      else
        echo "GITHUB_TOKEN not found, skipping GitHub sync.";
      fi
  only:
    - main
    - develop
    - hugo
    - ghost
    - i18n
    - wikijs
    - wikijs-new
