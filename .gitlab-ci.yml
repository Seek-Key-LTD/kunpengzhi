# 鲲鹏志 CI/CD 配置 - Runner 作为二传手
# GitLab -> Runner -> GitHub (代码同步)
# GitHub Actions 负责构建和部署到 Pages

variables:
  GITHUB_USERNAME: "Seek-Key-LTD"
  GITHUB_REPO: "kunpengzhi"

stages:
  - sync

sync_to_github:
  stage: sync
  tags:
    - group
  script:
    - echo "配置 Git..."
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - git remote add github "https://${GITHUB_TOKEN}@github.com/${GITHUB_USERNAME}/${GITHUB_REPO}.git" 2>/dev/null || true
    # 在 detached HEAD 状态下推送当前分支
    - git push -f github HEAD:hugo
    - echo "代码已同步到 GitHub!"
  only:
    - hugo