stages:
  - sync

sync_to_github:
  stage: sync
  tags:
    - group
  script:
    - echo "=== DEBUG ==="
    - echo "GITHUB_TOKEN is set: ${GITHUB_TOKEN:+YES}${GITHUB_TOKEN:-NO}"
    - echo "GITHUB_TOKEN length: ${#GITHUB_TOKEN}"
    - echo "=== END DEBUG ==="
    - git config --global user.email "ci@gitlab.local"
    - git config --global user.name "GitLab CI"
    - git remote add github "https://${GITHUB_TOKEN}@github.com/Seek-Key-LTD/kunpengzhi.git" 2>/dev/null || git remote set-url github "https://${GITHUB_TOKEN}@github.com/Seek-Key-LTD/kunpengzhi.git"
    - git push -f github HEAD:hugo
  only:
    - hugo
